<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f2933"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="760" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Per-Connection Handshake &amp; Decision Flow</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">what the gateway decides for every incoming TLS connection</text>

  <!-- start -->
  <rect x="340" y="76" width="220" height="48" rx="24" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/>
  <text x="450" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Client opens TCP + ClientHello</text>
  <line x1="450" y1="124" x2="450" y2="150" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>

  <!-- read groups -->
  <rect x="300" y="152" width="300" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Gateway reads offered key-exchange groups</text>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#1e40af">+ records client_id from SNI</text>
  <line x1="450" y1="208" x2="450" y2="236" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision 1: offers MLKEM? -->
  <polygon points="450,238 620,318 450,398 280,318" fill="#fffbeb" stroke="#1f2933" stroke-width="1.8"/>
  <text x="450" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Client offers</text>
  <text x="450" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">X25519MLKEM768?</text>

  <!-- yes branch -->
  <line x1="450" y1="398" x2="450" y2="440" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="466" y="422" font-size="12" font-weight="700" fill="#166534">YES</text>
  <rect x="300" y="442" width="300" height="86" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="450" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Negotiate hybrid post-quantum</text>
  <text x="450" y="488" text-anchor="middle" font-size="11.5" fill="#166534">key_chosen = X25519MLKEM768</text>
  <text x="450" y="506" text-anchor="middle" font-size="11.5" fill="#166534">strength = "strong"</text>
  <text x="450" y="522" text-anchor="middle" font-size="11" fill="#15803d">cert signed ML-DSA-65 · cipher AES-128-GCM</text>

  <!-- no branch -->
  <line x1="620" y1="318" x2="720" y2="318" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <text x="662" y="308" font-size="12" font-weight="700" fill="#b45309">NO (classical only)</text>
  <!-- decision 2: mode? -->
  <polygon points="760,250 870,318 760,386 650,318" fill="#fffbeb" stroke="#1f2933" stroke-width="1.8"/>
  <text x="760" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Mode?</text>
  <text x="760" y="332" text-anchor="middle" font-size="10.5" fill="#64748b">strict / legacy</text>

  <!-- strict -> reject -->
  <path d="M760 386 L760 452" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="776" y="424" font-size="11.5" font-weight="700" fill="#991b1b">strict</text>
  <rect x="640" y="454" width="240" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="760" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">REJECT handshake</text>
  <text x="760" y="500" text-anchor="middle" font-size="11.5" fill="#991b1b">tls_version="none", key_chosen="rejected"</text>
  <text x="760" y="518" text-anchor="middle" font-size="11.5" fill="#991b1b">strength="weak" · no data forwarded</text>

  <!-- legacy -> accept weak -->
  <path d="M650 350 C 300 400, 180 420, 180 452" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#aw)"/>
  <text x="300" y="392" font-size="11.5" font-weight="700" fill="#b45309">legacy</text>
  <rect x="60" y="454" width="240" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="180" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Accept classical X25519</text>
  <text x="180" y="500" text-anchor="middle" font-size="11.5" fill="#92400e">key_chosen="X25519"</text>
  <text x="180" y="518" text-anchor="middle" font-size="11.5" fill="#92400e">strength="weak" (logged, allowed)</text>

  <!-- all three -> write note -->
  <line x1="180" y1="534" x2="180" y2="580" stroke="#1f2933" stroke-width="1.8"/>
  <line x1="450" y1="528" x2="450" y2="580" stroke="#1f2933" stroke-width="1.8"/>
  <line x1="760" y1="534" x2="760" y2="580" stroke="#1f2933" stroke-width="1.8"/>
  <line x1="180" y1="580" x2="760" y2="580" stroke="#1f2933" stroke-width="1.8"/>
  <line x1="450" y1="580" x2="450" y2="606" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>

  <rect x="285" y="608" width="330" height="56" rx="10" fill="#f8fafc" stroke="#1f2933" stroke-width="1.8"/>
  <text x="450" y="632" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Append ONE JSON note to the log</text>
  <text x="450" y="651" text-anchor="middle" font-size="10.5" fill="#64748b">frozen fields — the Detector (D) reads these</text>

  <!-- then forward (only if ok) -->
  <line x1="450" y1="664" x2="450" y2="692" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="694" width="300" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="722" text-anchor="middle" font-size="12.5" fill="#1e3a8a">If handshake succeeded → forward bytes to backend</text>
</svg>
